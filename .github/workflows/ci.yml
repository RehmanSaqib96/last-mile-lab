name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest --cov=lastmile --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t last-mile-lab:ci .
      - name: Smoke test
        run: |
          docker run -d -p 8000:8000 --name api last-mile-lab:ci
          for i in $(seq 1 20); do curl -fs http://localhost:8000/health && exit 0; sleep 1; done
          docker logs api; exit 1
