[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lastmile"
version = "0.1.0"
description = "Last Mile Lab: delivery route optimisation, driver-behaviour learning and carbon-aware EV charging"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Saqib Rehman" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "ortools>=9.10",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "requests>=2.31",
    "ijson>=3.2",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.4", "matplotlib>=3.8"]
geo = ["osmnx>=1.9", "networkx>=3.2", "geopandas>=0.14", "scikit-learn>=1.4"]
dashboard = ["streamlit>=1.33", "pydeck>=0.8"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.4", "httpx>=0.27", "scikit-learn>=1.4", "networkx>=3.2"]
all = ["lastmile[ml,geo,dashboard,dev]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
